name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: yunying_v4_test
        options: >-
          --publish 127.0.0.1:33316:3306
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '33316'
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: yunying_v4_test
      SITE_AI_RECORDS_ENABLED: '0'
      YUNYING_TEST_DB: yunying_v4_test
      YUNYING_RUN_PROFILE_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: yunying-dsh/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global pnpm@10.33.0 --ignore-scripts
          npm ci --prefix yunying-dsh --ignore-scripts
      - name: Initialize disposable schema
        run: |
          python - <<'PY'
          from igngbot_v3.config import Config
          from igngbot_v3.db import DBHandler
          from igngbot_v4.migrate import connect, migrate
          db = DBHandler(Config())
          db.init_message_tables()
          db.init_group_configs_table()
          db.conn.close()
          with connect() as conn:
              migrate(conn)
              with conn.cursor() as cur:
                  cur.execute('SELECT VERSION() AS version')
                  print('Disposable MySQL:', cur.fetchone()['version'])
          PY
      - name: Syntax and credential checks
        run: |
          python -m compileall -q igngbot_v3 igngbot_v4 scripts
          npm --prefix yunying-dsh run check
          bash -n deploy/deploy-nas.sh deploy/deploy-v4-nas.sh
          sh -n scripts/run-yunying-profile.sh
          bash scripts/privacy-scan.sh
      - name: Python and published Profile process tests
        run: python -m pytest tests -q
      - name: Native DSH and MySQL tests
        run: npm --prefix yunying-dsh test
