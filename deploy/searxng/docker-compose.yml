services:
  searxng:
    image: "${SEARXNG_IMAGE:-dockerproxy.net/searxng/searxng:latest}"
    container_name: igngbot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_INSTANCE_NAME: "IGNGbot Search"
      SEARXNG_FORMATS: "html,json"
      SEARXNG_LIMITER: "false"
    volumes:
      - ./searxng:/etc/searxng:rw
