[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:qq]
command=qq --no-sandbox %(ENV_SNOWLUMA_QQ_FLAGS)s
directory=/app
user=snowluma
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",SNOWLUMA_HOOK_RUNTIME_DIR="%(ENV_SNOWLUMA_HOOK_RUNTIME_DIR)s"

; Do not start the hook runtime in the same breath as QQ.  On 2026-10-20 and
; again on the 2026-10-21 reboot SnowLuma attached to a QQ process that had not
; finished restoring its session; the hook never received a login event and
; OneBot stayed offline while both processes looked healthy.  This wrapper
; waits for the local PT login probe to report the restored account first.
[program:snowluma]
command=/bin/sh /opt/igngbot/run-snowluma-after-login.sh
directory=/app/snowluma-data
user=snowluma
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",SNOWLUMA_HOOK_RUNTIME_DIR="%(ENV_SNOWLUMA_HOOK_RUNTIME_DIR)s",SNOWLUMA_LOG_LEVEL="%(ENV_SNOWLUMA_LOG_LEVEL)s",SNOWLUMA_HOOK_AUTOLOAD="%(ENV_SNOWLUMA_HOOK_AUTOLOAD)s"

[include]
files=/etc/supervisor/conf.d/*.conf
