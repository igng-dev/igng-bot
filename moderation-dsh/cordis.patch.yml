- id: tools
  config: { mode: native }
- id: llm-pi-ai
  config:
    # Official adapter, independent credentials. An empty/off Profile creates no
    # model route and never borrows the social Profile's provider or secrets.
    providers: !!js >-
      process.env.WORK_MODERATION_WORKER_ENABLED === '1' ? {
        'work-moderation': {
          api: process.env.WORK_MODERATION_MODEL_PROTOCOL || 'anthropic-messages',
          baseURL: process.env.WORK_MODERATION_MODEL_BASE_URL,
          apiKeyEnv: 'WORK_MODERATION_MODEL_API_KEY',
          models: [{ id: process.env.WORK_MODERATION_MODEL, input: ['text'],
            contextWindow: Number(process.env.WORK_MODERATION_CONTEXT_WINDOW || 262144),
            maxTokens: Number(process.env.WORK_MODERATION_OUTPUT_TOKENS || 8192) }]
        }
      } : {}
- id: compaction-basic
  config:
    thresholdRatio: 0.2
    headroomTokens: 4096
    retainTokens: 12000
    maxTokens: 4096
- insert:
    - id: work-moderation
      name: '@igng/work-moderation-dsh'
