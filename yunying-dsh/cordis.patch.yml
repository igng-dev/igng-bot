- id: tools
  config:
    mode: native
# Context budget: the routed gateway model is declared with its real capacity in
# the operator patch, so compaction-basic must be given an explicit policy. The
# dsh-base defaults (thresholdRatio 0.8, headroomTokens 65536) assume a large
# window; on a smaller declared window they resolve to a negative pressure
# budget and the plugin skips proactive compaction entirely (it only recovers
# after a provider-confirmed overflow), which is how one Session grew past
# 370k tokens per request.
#
# DSH prices retained messages with a fixed 4-characters/token heuristic. That
# underestimates this Chinese QQ profile by roughly 1.8x, while compaction is
# triggered by the provider's real input count. The earlier 0.2 / 16k policy
# therefore left the post-compaction floor (system + tools + retained tail)
# at about 50k of a 52k trigger: every tool step compacted once or twice and
# still stayed above threshold. At 0.4 the trigger is ~105k, and retaining 8k
# (roughly 14k provider tokens) leaves enough headroom for a real reduction.
# This is still far more history than the donor V2 context manager (~1600
# tokens), and well below the 262144-token window, so it cannot reintroduce the
# 370k overflow.
- id: compaction-basic
  config:
    thresholdRatio: 0.4
    headroomTokens: 16384
    retainTokens: 8192
    maxTokens: 16384
